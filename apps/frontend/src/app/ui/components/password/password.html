<div class="flex flex-col gap-2">
  <div class="relative">
    <input
      pInputText
      class="w-full pr-11"
      [class]="customClass()"
      [class.p-invalid]="showsError()"
      [id]="inputId()"
      [type]="visible() ? 'text' : 'password'"
      [value]="value()"
      [disabled]="disabled()"
      [placeholder]="placeholder()"
      [attr.autocomplete]="autocomplete()"
      [attr.aria-invalid]="showsError()"
      [attr.aria-describedby]="describedByIds()"
      (input)="onInput($event)"
      (blur)="touch.emit()"
    />
    <button
      type="button"
      class="absolute inset-y-0 right-1 my-auto grid size-9 min-w-9 min-h-9 place-items-center rounded-control text-text-3 transition-colors hover:bg-hover hover:text-text focus-visible:focus-ring disabled:pointer-events-none"
      [disabled]="disabled()"
      [attr.aria-label]="(visible() ? 'auth.password.hide' : 'auth.password.show') | translate"
      [attr.aria-pressed]="visible()"
      [attr.aria-controls]="inputId()"
      (click)="visible.set(!visible())"
    >
      <ng-icon
        [name]="visible() ? 'lucideEyeOff' : 'lucideEye'"
        size="1.125rem"
        aria-hidden="true"
      />
    </button>
  </div>

  @if (showStrength()) {
    <div [id]="strengthId()" aria-live="polite">
      @if (strength(); as strength) {
        <div class="flex gap-1" aria-hidden="true">
          @for (bar of bars; track bar) {
            <span
              class="h-1 flex-1 rounded-full transition-colors duration-200"
              [class]="bar <= strength.score ? barClass[strength.level] : 'bg-viz-track'"
            ></span>
          }
        </div>
        <p class="mt-1.5 text-xs font-medium" [class]="textClass[strength.level]">
          {{ 'auth.passwordStrength.levels.' + strength.level | translate }}
          @if (strength.missingKey) {
            <span class="font-normal text-text-2">· {{ strength.missingKey | translate }}</span>
          }
        </p>
      } @else {
        <p class="text-xs text-text-3">{{ 'auth.passwordStrength.hint' | translate }}</p>
      }
    </div>
  }
</div>
