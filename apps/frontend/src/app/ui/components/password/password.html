<div class="flex justify-center w-full">
  <div class="flex flex-col gap-2 w-full">
    <p-iconfield>
      <input
        [id]="inputId()"
        autocomplete="new-password"
        [formField]="passwordForm"
        [class]="customClass()"
        [mask]="mask()"
        [placeholder]="placeholder()"
        (focus)="op.show($event)"
        (blur)="op.hide()"
        pInputPassword
      />
      <p-inputicon (click)="mask.set(!mask())" style="cursor: pointer">
        @if (mask()) {
          <svg data-p-icon="eye"></svg>
        } @else {
          <svg data-p-icon="eye-slash"></svg>
        }
      </p-inputicon>
    </p-iconfield>

    <p-popover #op>
      <div class="w-72">
        <ul class="flex flex-col gap-2 list-none m-0 p-0">
          @for (rule of rules(); track rule.id) {
            <li class="flex items-center gap-2 text-xs">
              @if (rule.test(value())) {
                <svg data-p-icon="check" class="text-success"></svg>
              } @else {
                <svg data-p-icon="times" class="text-danger"></svg>
              }
              <span [class]="rule.test(value()) ? 'text-surface-500' : 'text-surface-700'">{{
                rule.label | translate
              }}</span>
            </li>
          }
        </ul>
      </div>
    </p-popover>
  </div>
</div>
