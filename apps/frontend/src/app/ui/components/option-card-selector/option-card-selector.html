<div class="grid gap-3 sm:grid-cols-2">
  @for (option of options(); track option.value) {
    @let isSelected = this.value().includes(option.value);
    <button
      type="button"
      class="group flex min-h-41.5 flex-col rounded-2xl border p-5 text-left transition-colors hover:border-highlight hover:shadow-sm"
      [class.bg-white]="!isSelected && !disabled()"
      [class.hover:border-highlight]="!isSelected && !disabled()"
      [class.hover:shadow-sm]="!isSelected && !disabled()"
      [class.surface-highlight]="isSelected"
      [class.border-surface]="!isSelected"
      [disabled]="disabled()"
      [attr.aria-pressed]="isSelected"
      [class.cursor-pointer]="!disabled()"
      [class.opacity-70]="disabled()"
      (click)="toggleSelection(option.value)"
    >
      <span
        class="border-0! mb-4 flex h-10 w-10 text-lg items-center justify-center rounded-xl"
        [class.text-primary]="!disabled()"
        [class.surface-highlight]="!disabled()"
      >
        <ng-icon [name]="option.icon" aria-hidden="true" />
      </span>
      <span class="mb-1 block text-sm font-semibold">{{ option.label }}</span>
      <span class="block text-xs leading-5 text-muted-foreground">
        {{ option.description }}
      </span>
      <span
        class="mt-auto flex h-4 items-center gap-1 text-xs font-semibold text-primary"
        aria-hidden="true"
      >
        @if (isSelected) {
          <span class="max-h-3.5 text-sm"><ng-icon name="lucideCheck" /></span>
          Seleccionado
        }
      </span>
    </button>
  }
</div>
