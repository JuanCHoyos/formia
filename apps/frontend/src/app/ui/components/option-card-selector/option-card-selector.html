<div class="grid gap-3 sm:grid-cols-2" role="group" [attr.aria-label]="ariaLabel()">
  @for (option of options(); track option.value) {
    <label
      class="group relative flex flex-col gap-3 rounded-panel border border-border bg-surface p-4 text-left shadow-1 transition-[border-color,background-color,box-shadow] duration-150 has-checked:border-brand has-checked:bg-brand-soft has-checked:shadow-[0_0_0_1px_var(--p-primary-color)] has-focus-visible:focus-ring has-disabled:cursor-not-allowed has-disabled:opacity-60 has-enabled:cursor-pointer has-enabled:hover:border-border-hover has-enabled:has-checked:hover:border-brand sm:p-5"
    >
      <input
        type="checkbox"
        class="sr-only"
        [checked]="isSelected(option.value)"
        [disabled]="disabled()"
        (change)="toggleSelection(option.value)"
      />

      <span class="flex items-start justify-between gap-3">
        <span
          class="flex size-10 shrink-0 items-center justify-center rounded-menu bg-brand-soft text-brand-text transition-colors group-has-checked:bg-brand group-has-checked:text-on-brand"
          aria-hidden="true"
        >
          <ng-icon [name]="option.icon" size="1.25rem" />
        </span>
        <span
          class="flex size-[18px] shrink-0 items-center justify-center rounded-[4px] border border-border-strong bg-surface text-on-brand transition-colors group-has-checked:border-brand group-has-checked:bg-brand"
          aria-hidden="true"
        >
          <ng-icon
            name="lucideCheck"
            size="0.75rem"
            class="scale-50 opacity-0 transition-[opacity,transform] duration-150 group-has-checked:scale-100 group-has-checked:opacity-100"
          />
        </span>
      </span>

      <span class="flex flex-col gap-1">
        <span class="text-sm font-semibold text-text">{{ option.label }}</span>
        <span class="text-xs leading-5 text-text-2">{{ option.description }}</span>
      </span>
    </label>
  }
</div>
