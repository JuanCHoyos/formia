<label
  [for]="inputId()"
  class="flex w-full items-center gap-3 rounded-control border border-transparent px-3 py-2 select-none transition-colors hover:bg-hover"
  [class.cursor-pointer]="!disabled()"
  [class.cursor-not-allowed]="disabled()"
  [class.opacity-60]="disabled()"
  [class.bg-brand-soft]="checkboxForm().value()"
  [class.border-brand-bd]="checkboxForm().value()"
>
  <p-checkbox
    [formField]="checkboxForm"
    [binary]="true"
    [inputId]="inputId()"
    [disabled]="disabled()"
    (onChange)="markAsTouched()"
    (onBlur)="markAsTouched()"
  />
  <div class="flex flex-col gap-0.5">
    <span class="text-sm font-medium text-text">{{ label() }}</span>
    @if (description()) {
      <small class="text-xs text-text-2">{{ description() }}</small>
    }
  </div>
</label>
