<label
  [for]="inputId()"
  class="flex w-full items-start gap-3 rounded-menu border px-3.5 py-3 select-none transition-colors"
  [class]="
    checkboxForm().value()
      ? 'border-brand-bd bg-brand-soft'
      : 'border-border bg-surface hover:border-border-hover'
  "
  [class.cursor-pointer]="!disabled()"
  [class.cursor-not-allowed]="disabled()"
  [class.opacity-60]="disabled()"
>
  <p-checkbox
    [formField]="checkboxForm"
    [binary]="true"
    [inputId]="inputId()"
    [disabled]="disabled()"
    (onChange)="markAsTouched()"
    (onBlur)="markAsTouched()"
    class="mt-0.5"
  />
  <div class="flex flex-col gap-0.5">
    <span class="text-h3 text-text">{{ label() }}</span>
    @if (description()) {
      <small class="text-xs text-text-2">{{ description() }}</small>
    }
  </div>
</label>
