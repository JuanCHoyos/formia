<div class="flex flex-col gap-2">
  <div class="flex flex-col gap-2" [ngClass]="{ 'flex-row items-center': hasInlineLabel() }">
    @if (props.label) {
      <div class="grid grid-cols-[1fr_auto] items-center">
        <label [for]="field.id" class="text-base font-medium" [class.order-2]="hasInlineLabel()">
          {{ props.label }}
        </label>
        @if (props.required) {
          <span
            aria-hidden="true"
            class="bg-danger/10 text-danger/80 text-xs font-medium py-1 px-2 rounded-xl max-w-fit"
            >{{ 'formBuilder.fieldWrapper.required' | translate }}</span
          >
        }
      </div>
    }
    @if (props.description) {
      <small class="text-xs text-muted-color font-medium">
        {{ props.description }}
      </small>
    }

    <ng-container #fieldComponent />
  </div>
  @if (formControl.invalid && formControl.touched) {
    <small class="text-xs text-danger">
      {{ 'This field is required.' }}
    </small>
  }
</div>
