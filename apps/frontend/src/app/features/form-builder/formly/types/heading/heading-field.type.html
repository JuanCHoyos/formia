<section
  class="space-y-2 text-start"
  [class.text-center]="props.alignment === 'center'"
  [class.text-end]="props.alignment === 'end'"
>
  @switch (props.level) {
    @case (1) {
      <h1 class="text-4xl font-bold tracking-tight">{{ props.text }}</h1>
    }
    @case (2) {
      <h2 class="text-3xl font-bold tracking-tight">{{ props.text }}</h2>
    }
    @case (3) {
      <h3 class="text-2xl font-semibold tracking-tight">{{ props.text }}</h3>
    }
    @case (4) {
      <h4 class="text-xl font-semibold">{{ props.text }}</h4>
    }
    @case (5) {
      <h5 class="text-lg font-semibold">{{ props.text }}</h5>
    }
    @case (6) {
      <h6 class="text-base font-semibold">{{ props.text }}</h6>
    }
  }

  @if (props.subheading) {
    <app-text-rich [html]="props.subheading"></app-text-rich>
  }
</section>
