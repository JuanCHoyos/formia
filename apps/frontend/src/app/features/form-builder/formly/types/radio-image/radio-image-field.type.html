<div class="grid grid-cols-[repeat(auto-fill,minmax(8rem,1fr))] gap-4">
  @for (option of props.options; track option.value) {
    @let inputId = field.id + '-' + $index;
    <label
      [for]="inputId"
      class="flex flex-col justify-between gap-2 border border-gray-300 rounded-lg p-2 cursor-pointer hover:bg-gray-100"
      [class.border-primary]="formControl.value === option.value"
      [class.bg-primary/10]="formControl.value === option.value"
    >
      <div
        class="size-6 grid place-content-center border-2 rounded-full ml-auto text-white"
        [class.border-gray-300]="formControl.value !== option.value"
        [class.border-primary]="formControl.value === option.value"
        [class.bg-primary]="formControl.value === option.value"
      >
        <ng-icon name="lucideCheck" [class.hidden]="formControl.value !== option.value"></ng-icon>
      </div>
      @if (option.image) {
        <img [src]="option.image" [alt]="option.label" />
      }
      <div class="flex items-center gap-2">
        <p-radiobutton
          [inputId]="inputId"
          [name]="field.id"
          [value]="option.value"
          [formControl]="formControl"
        />
        <span>{{ option.label }}</span>
      </div>
    </label>
  }
</div>
