<app-button
  icon="lucideSettings2"
  variant="text"
  [iconOnly]="true"
  [ariaLabel]="'formBuilder.header.settings' | translate"
  (pressed)="settingsPopover.toggle($event)"
/>

<p-popover #settingsPopover [dismissable]="true">
  <section
    class="flex w-80 flex-col gap-4"
    [attr.aria-label]="'formBuilder.settings.ariaLabel' | translate"
  >
    <h2 class="text-sm font-semibold">{{ 'formBuilder.settings.title' | translate }}</h2>

    <div class="flex items-start justify-between gap-4">
      <label class="flex flex-col gap-0.5" for="form-settings-public">
        <span class="text-sm font-medium">{{
          'formBuilder.settings.isPublic.label' | translate
        }}</span>
        <small class="text-xs text-muted-color">
          {{ 'formBuilder.settings.isPublic.description' | translate }}
        </small>
      </label>
      <p-toggleswitch
        inputId="form-settings-public"
        class="min-w-(--p-toggleswitch-width) shrink-0"
        [formField]="settingsForm.isPublic"
      />
    </div>

    <div class="flex items-start justify-between gap-4">
      <label class="flex flex-col gap-0.5" for="form-settings-multiple">
        <span class="text-sm font-medium">
          {{ 'formBuilder.settings.allowMultiple.label' | translate }}
        </span>
        <small class="text-xs text-muted-color">
          {{ 'formBuilder.settings.allowMultiple.description' | translate }}
        </small>
      </label>
      <p-toggleswitch
        inputId="form-settings-multiple"
        class="min-w-(--p-toggleswitch-width) shrink-0"
        [formField]="settingsForm.allowMultipleSubmissions"
        (onChange)="onAllowMultipleChange($event.checked)"
      />
    </div>

    @if (settings().allowMultipleSubmissions) {
      <div class="flex flex-col gap-1">
        <label class="text-xs font-semibold text-muted-color" for="form-settings-max">
          {{ 'formBuilder.settings.maxPerUser.label' | translate }}
        </label>
        <p-inputnumber
          inputId="form-settings-max"
          mode="decimal"
          [min]="minMultipleSubmissions"
          [maxFractionDigits]="0"
          [showButtons]="true"
          [formField]="settingsForm.maxSubmissionsPerUser"
          class="w-full"
        />
        <small class="text-xs text-muted-color">
          {{ 'formBuilder.settings.maxPerUser.description' | translate }}
        </small>
      </div>
    }
  </section>
</p-popover>
