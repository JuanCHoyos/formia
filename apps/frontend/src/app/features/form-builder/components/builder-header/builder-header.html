<header
  [attr.aria-label]="'formBuilder.header.ariaLabel' | translate"
  class="flex h-full items-center gap-2.5"
>
  <div class="flex min-w-0 items-center gap-1.5">
    <app-button icon="lucideArrowLeft" variant="text" size="small" (pressed)="goToForms()">
      <span class="hidden lg:inline">{{ 'formBuilder.header.myForms' | translate }}</span>
    </app-button>
    <span class="mx-1.5 h-8 w-px bg-border" aria-hidden="true"></span>
    <app-form-title-editor />
  </div>

  <span class="flex-1"></span>

  <div class="flex items-center gap-2">
    <app-save-status />
    <app-button
      [icon]="formPreviewState.previewIcon()"
      variant="outlined"
      severity="secondary"
      (pressed)="formPreviewState.togglePreviewMode()"
    >
      {{ formPreviewState.previewText() | translate }}
    </app-button>
    @if (sync.hasDraft() && sync.publishedVersion() > 0) {
      <app-button
        icon="lucideUndo2"
        variant="text"
        severity="secondary"
        (pressed)="sync.discardDraft()"
      >
        {{ 'formBuilder.header.discardChanges' | translate }}
      </app-button>
    }
    <app-published-versions-menu />
    <app-button
      icon="lucideRocket"
      [disabled]="!sync.hasDraft()"
      [loading]="sync.publishing()"
      (pressed)="sync.publish()"
      >{{ 'formBuilder.header.publish' | translate }}</app-button
    >
    <app-form-settings-popover />
  </div>
</header>
