<div class="flex items-center gap-1">
  @if (editing()) {
    <div class="flex flex-col gap-0.5">
      <input
        #titleInput
        pInputText
        pSize="small"
        type="text"
        class="w-64 text-base font-semibold"
        placeholder="{{ 'formBuilder.header.titlePlaceholder' | translate }}"
        [class.p-invalid]="titleTooShort()"
        [value]="draft()"
        [attr.aria-label]="'formBuilder.header.editTitle' | translate"
        [attr.aria-invalid]="titleTooShort()"
        [attr.aria-describedby]="titleTooShort() ? 'builder-title-error' : null"
        (input)="draft.set(titleInput.value)"
        (keydown.enter)="save()"
        (keydown.escape)="cancel()"
      />
      @if (titleTooShort()) {
        <span id="builder-title-error" class="sr-only" role="alert">
          {{ 'formBuilder.header.titleTooShort' | translate: { min: minTitleLength } }}
        </span>
      }
    </div>
    <app-button
      icon="lucideCheck"
      size="small"
      [iconOnly]="true"
      [disabled]="titleTooShort()"
      [ariaLabel]="'formBuilder.header.saveTitle' | translate"
      (pressed)="save()"
    />
  } @else {
    <span class="max-w-64 truncate text-base font-semibold" [title]="title()">{{ title() }}</span>
    <app-button
      icon="lucidePencil"
      size="small"
      variant="text"
      [iconOnly]="true"
      [ariaLabel]="'formBuilder.header.editTitle' | translate"
      (pressed)="startEditing()"
    />
  }
</div>
