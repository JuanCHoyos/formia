<div class="flex items-center gap-1">
  @if (editing()) {
    <div class="flex flex-col gap-0.5">
      <input
        #titleInput
        pInputText
        pSize="small"
        type="text"
        class="w-64 text-sm font-bold"
        placeholder="{{ 'formBuilder.header.titlePlaceholder' | translate }}"
        [class]="titleTooShort() ? 'border-danger! text-danger' : ''"
        [value]="draft()"
        [attr.aria-label]="'formBuilder.header.editTitle' | translate"
        [attr.aria-invalid]="titleTooShort()"
        [attr.aria-describedby]="titleTooShort() ? 'builder-title-error' : null"
        (input)="draft.set(titleInput.value)"
        (keydown.enter)="save()"
        (keydown.escape)="cancel()"
      />
    </div>
    <app-button
      icon="lucideCheck"
      size="small"
      [iconOnly]="true"
      [disabled]="titleTooShort()"
      [ariaLabel]="'formBuilder.header.saveTitle' | translate"
      (pressed)="save()"
    />
  } @else {
    <span class="max-w-64 truncate text-sm font-bold" [title]="title()">{{ title() }}</span>
    <app-button
      icon="lucidePencil"
      size="small"
      [iconOnly]="true"
      [ariaLabel]="'formBuilder.header.editTitle' | translate"
      (pressed)="startEditing()"
    />
  }
</div>
