<aside
  [attr.aria-label]="'formBuilder.sidebar.fieldsAriaLabel' | translate"
  class="flex h-full min-h-0 flex-col overflow-hidden"
>
  <header class="flex h-14 shrink-0 items-center justify-between border-b border-border px-3">
    <h2 class="text-xs font-bold tracking-[0.04em] text-text-2 uppercase">
      {{ 'formBuilder.sidebar.build' | translate }}
    </h2>
    <app-button
      icon="lucidePanelLeftClose"
      variant="text"
      size="small"
      [iconOnly]="true"
      severity="secondary"
      [ariaLabel]="'formBuilder.sidebar.close' | translate"
      (pressed)="menuState.toggleLeftMenu()"
    />
  </header>
  <section class="relative min-h-0 w-full flex-1 overflow-y-auto px-3 pt-3 pb-4">
    <p-tabs value="components">
      <p-tablist>
        <p-tab value="components">{{ 'formBuilder.sidebar.components' | translate }}</p-tab>
        <p-tab value="tree">{{ 'formBuilder.sidebar.tree' | translate }}</p-tab>
      </p-tablist>
      <p-tabpanels>
        <p-tabpanel value="components">
          <app-builder-sidebar-components />
        </p-tabpanel>
        <p-tabpanel value="tree">
          <app-tree-selector
            [items]="items()"
            [search]="true"
            [sort]="true"
            (sortedItems)="onSort($event)"
            [selectedItem]="formBuilderStore.selectedField()"
            (selectedItemChange)="edit($event)"
          ></app-tree-selector>
        </p-tabpanel>
      </p-tabpanels>
    </p-tabs>
  </section>
</aside>
