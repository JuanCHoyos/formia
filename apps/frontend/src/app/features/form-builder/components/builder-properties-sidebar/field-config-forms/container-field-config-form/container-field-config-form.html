<p-accordion [value]="['0']" [multiple]="true" class="w-full">
  <p-accordion-panel value="0">
    <p-accordion-header>
      <div class="flex flex-col gap-1.5">
        <p class="text-sm font-semibold text-text">
          {{ 'formBuilder.properties.sections.general.title' | translate }}
        </p>
        <small class="text-xs font-normal text-text-2">
          {{ 'formBuilder.properties.sections.general.description' | translate }}
        </small>
      </div>
    </p-accordion-header>
    <p-accordion-content>
      <div class="flex flex-col gap-3">
        <div class="flex flex-col gap-1.5">
          <label class="text-[13px] font-medium text-text" for="container-label">
            {{ 'formBuilder.properties.container.label' | translate }}
          </label>
          <input
            id="container-label"
            pInputText
            [formField]="containerFieldSettingsForm.label"
            class="w-full"
          />
        </div>
        <div class="flex flex-col gap-1.5">
          <label class="text-[13px] font-medium text-text" for="container-cols">
            {{ 'formBuilder.properties.container.columns' | translate }}
          </label>
          <p-inputnumber
            inputId="container-cols"
            mode="decimal"
            [min]="1"
            [maxFractionDigits]="0"
            [formField]="containerFieldSettingsForm.cols"
          />
          @if (containerFieldSettingsForm.cols().invalid()) {
            @for (error of containerFieldSettingsForm.cols().errors(); track error.kind) {
              <small class="text-danger-text">
                {{ error.message }}
              </small>
            }
          }
        </div>
      </div>
    </p-accordion-content>
  </p-accordion-panel>
</p-accordion>
