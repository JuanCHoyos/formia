<section class="flex flex-col gap-3">
  <div class="flex flex-col gap-1.5">
    <label class="text-sm font-medium text-text" for="prop-label">
      {{ 'formBuilder.properties.common.label' | translate }}
    </label>
    <input id="prop-label" [formField]="commonFieldConfigForm().label" class="w-full" pInputText />
  </div>

  <div class="flex flex-col gap-1.5">
    <label class="text-sm font-medium text-text" for="prop-description">
      {{ 'formBuilder.properties.common.description' | translate }}
    </label>
    <textarea
      id="prop-description"
      [formField]="commonFieldConfigForm().description"
      class="w-full min-h-20"
      pTextarea
    ></textarea>
  </div>

  <ng-content />

  <app-checkbox
    [formField]="commonFieldConfigForm().required"
    [label]="'formBuilder.properties.common.required.label' | translate"
    [description]="'formBuilder.properties.common.required.description' | translate"
  ></app-checkbox>

  <app-checkbox
    [formField]="commonFieldConfigForm().disabled"
    [label]="'formBuilder.properties.common.disabled.label' | translate"
    [description]="'formBuilder.properties.common.disabled.description' | translate"
  ></app-checkbox>
</section>
