<section class="flex flex-col gap-4">
  <p-accordion [value]="['0', '1']" [multiple]="true" class="w-full">
    <p-accordion-panel value="0">
      <p-accordion-header>
        <div class="flex flex-col gap-1">
          <p class="text-sm font-bold">
            {{ 'formBuilder.properties.sections.general.title' | translate }}
          </p>
          <small class="text-xs text-muted-color">
            {{ 'formBuilder.properties.sections.general.description' | translate }}
          </small>
        </div>
      </p-accordion-header>
      <p-accordion-content>
        <app-common-field-config-form
          [commonFieldConfigForm]="{
            label: textFieldSettingsForm.label,
            description: textFieldSettingsForm.description,
            required: textFieldSettingsForm.required,
            disabled: textFieldSettingsForm.disabled,
          }"
        >
          <div class="flex flex-col gap-1">
            <label class="text-xs font-semibold text-muted-color" for="text-placeholder">
              {{ 'formBuilder.properties.common.placeholder' | translate }}
            </label>
            <input
              id="text-placeholder"
              pInputText
              [formField]="textFieldSettingsForm.placeholder"
              class="w-full"
            />
          </div>
        </app-common-field-config-form>
      </p-accordion-content>
    </p-accordion-panel>
    <p-accordion-panel value="1">
      <p-accordion-header>
        <div class="flex flex-col gap-1">
          <p class="text-sm font-bold">
            {{ 'formBuilder.properties.sections.preferences.title' | translate }}
          </p>
          <small class="text-xs text-muted-color">
            {{ 'formBuilder.properties.sections.preferences.description' | translate }}
          </small>
        </div>
      </p-accordion-header>
      <p-accordion-content>
        <div class="flex flex-col gap-2">
          <div class="flex flex-col gap-1">
            <label class="text-xs font-semibold text-muted-color" for="text-pattern">
              {{ 'formBuilder.properties.text.pattern' | translate }}
            </label>
            <input
              id="text-pattern"
              pInputText
              [formField]="textFieldSettingsForm.pattern"
              class="w-full"
            />
          </div>
        </div>
      </p-accordion-content>
    </p-accordion-panel>
  </p-accordion>
</section>
