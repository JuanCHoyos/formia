<p-accordion [value]="['0', '1']" [multiple]="true" class="w-full">
  <p-accordion-panel value="0">
    <p-accordion-header>
      <div class="flex flex-col gap-1.5">
        <p class="text-sm font-semibold text-text">
          {{ 'formBuilder.properties.sections.general.title' | translate }}
        </p>
        <small class="text-xs font-normal text-text-2">
          {{ 'formBuilder.properties.sections.general.description' | translate }}
        </small>
      </div>
    </p-accordion-header>
    <p-accordion-content>
      <app-common-field-config-form
        [commonFieldConfigForm]="{
          label: radioFieldSettingsForm.label,
          description: radioFieldSettingsForm.description,
          required: radioFieldSettingsForm.required,
          disabled: radioFieldSettingsForm.disabled,
        }"
      />
    </p-accordion-content>
  </p-accordion-panel>
  <p-accordion-panel value="1">
    <p-accordion-header>
      <div class="flex flex-col gap-1.5">
        <p class="text-sm font-semibold text-text">
          {{ 'formBuilder.properties.sections.options.title' | translate }}
        </p>
        <small class="text-xs font-normal text-text-2">
          {{ 'formBuilder.properties.sections.options.description' | translate }}
        </small>
      </div>
    </p-accordion-header>
    <p-accordion-content>
      <app-option-editor [formField]="radioFieldSettingsForm.options" [sort]="true" />
    </p-accordion-content>
  </p-accordion-panel>
</p-accordion>
