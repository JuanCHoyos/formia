<p-accordion [value]="['0']" [multiple]="true" class="w-full">
  <p-accordion-panel value="0">
    <p-accordion-header>
      <div class="flex flex-col gap-1.5">
        <p class="text-sm font-semibold text-text">
          {{ 'formBuilder.properties.sections.general.title' | translate }}
        </p>
        <small class="text-xs font-normal text-text-2">
          {{ 'formBuilder.properties.sections.general.description' | translate }}
        </small>
      </div>
    </p-accordion-header>
    <p-accordion-content>
      <div class="flex flex-col gap-3">
        <div class="flex flex-col gap-1.5">
          <label class="text-sm font-semibold text-text-3" for="image-src">
            {{ 'formBuilder.properties.image.src' | translate }}
          </label>
          <input
            id="image-src"
            pInputText
            type="url"
            [formField]="imageFieldSettingsForm.src"
            class="w-full"
          />
        </div>
        <div class="flex flex-col gap-1.5">
          <label class="text-sm font-semibold text-text-3" for="image-alt">
            {{ 'formBuilder.properties.image.alt' | translate }}
          </label>
          <input
            id="image-alt"
            pInputText
            [formField]="imageFieldSettingsForm.alt"
            class="w-full"
          />
        </div>
      </div>
    </p-accordion-content>
  </p-accordion-panel>
</p-accordion>
