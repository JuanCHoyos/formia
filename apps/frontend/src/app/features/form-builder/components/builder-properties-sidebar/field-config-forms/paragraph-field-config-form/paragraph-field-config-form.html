<p-accordion [value]="['0']" [multiple]="true" class="w-full">
  <p-accordion-panel value="0">
    <p-accordion-header>
      <div class="flex flex-col gap-1.5">
        <p class="text-sm font-semibold text-text">
          {{ 'formBuilder.properties.sections.general.title' | translate }}
        </p>
        <small class="text-xs font-normal text-text-2">
          {{ 'formBuilder.properties.sections.general.description' | translate }}
        </small>
      </div>
    </p-accordion-header>
    <p-accordion-content>
      <div class="flex flex-col gap-2">
        <label class="text-[13px] font-medium text-text" for="paragraph-text">
          {{ 'formBuilder.properties.paragraph.text' | translate }}
        </label>

        <app-text-editor
          [formField]="paragraphFieldSettingsForm.text"
          inputId="paragraph-text"
        ></app-text-editor>
      </div>
    </p-accordion-content>
  </p-accordion-panel>
</p-accordion>
