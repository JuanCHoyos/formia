<app-button icon="lucidePlus" (pressed)="openDialog()">
  {{ 'formBuilder.pages.add' | translate }}
</app-button>

<p-dialog
  [visible]="showDialog()"
  [modal]="true"
  [closeOnEscape]="true"
  [header]="'formBuilder.pages.createTitle' | translate"
  [style]="{ width: '25rem', maxWidth: '90vw' }"
  (visibleChange)="showDialog.set($event)"
>
  <form class="flex flex-col gap-4" (submit)="savePage($event)">
    <div class="flex flex-col gap-1.5">
      <label for="new-page-name">{{ 'formBuilder.pages.name' | translate }}</label>
      <input
        pInputText
        id="new-page-name"
        type="text"
        required
        [value]="pageName()"
        [placeholder]="'formBuilder.pages.namePlaceholder' | translate"
        (input)="updatePageName($event)"
      />
    </div>
    <div class="flex items-center justify-end gap-2">
      <app-button severity="secondary" variant="outlined" (pressed)="closeDialog()">
        {{ 'common.actions.cancel' | translate }}
      </app-button>
      <app-button type="submit" [disabled]="!pageName().trim()">
        {{ 'common.actions.save' | translate }}
      </app-button>
    </div>
  </form>
</p-dialog>
