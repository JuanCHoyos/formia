<main
  [attr.aria-label]="'formBuilder.workspace.canvasAriaLabel' | translate"
  class="flex min-h-full w-full justify-center px-4 py-6 lg:px-8"
>
  <div class="flex w-full max-w-148 flex-col gap-4">
    @if (formBuilderStore.selectedViewOption() !== 'form-scroll') {
      <h2 class="text-h2">{{ formBuilderStore.currentPage().props.label }}</h2>
      <app-builder-workspace-form-page
        [formFields]="formBuilderStore.currentPage().fieldGroup"
        [formPageId]="formBuilderStore.currentPage().id"
        class="w-full flex-1"
      />
    } @else {
      @for (page of formBuilderStore.fields().fieldGroup; track page.id) {
        <section class="flex flex-col gap-4" [attr.aria-label]="page.props.label">
          <h2 class="text-h2">{{ page.props.label }}</h2>
          <app-builder-workspace-form-page
            [formFields]="page.fieldGroup"
            [formPageId]="page.id"
            class="w-full"
          />
        </section>
      }
    }
  </div>
</main>
