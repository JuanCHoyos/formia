<section
  [attr.aria-label]="'formBuilder.workspace.preview' | translate"
  class="relative flex h-full min-h-0 w-full flex-col overflow-y-auto bg-bg p-4 md:p-8"
>
  <div
    class="m-auto w-full max-w-3xl rounded-panel border border-border bg-surface p-6 shadow-1 md:p-10"
  >
    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <formly-form [form]="form" [fields]="[fields()]" [model]="model" />
    </form>
  </div>
</section>
