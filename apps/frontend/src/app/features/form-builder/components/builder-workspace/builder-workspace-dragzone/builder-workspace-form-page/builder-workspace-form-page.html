<div
  [id]="formPageId()"
  class="flex min-h-32 flex-col gap-3"
  cdkDropList
  [cdkDropListConnectedTo]="formBuilderStore.dropListIds()"
  [cdkDropListData]="formFields()"
  (cdkDropListDropped)="drop($event)"
>
  @for (field of formFields(); track field) {
    <app-builder-workspace-form-field
      [field]="field"
      cdkDrag
      [cdkDragData]="field"
      (cdkDragStarted)="dragState.isDragging.set(true)"
      (cdkDragEnded)="dragState.isDragging.set(false)"
      (dropEmit)="drop($event)"
    />
  } @empty {
    <app-builder-workspace-empty-state class="block" />
  }
</div>
