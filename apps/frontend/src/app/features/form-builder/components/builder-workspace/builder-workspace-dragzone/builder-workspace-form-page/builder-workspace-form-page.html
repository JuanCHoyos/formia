<div class="flex h-full w-full flex-col gap-4">
  <div
    [id]="formPageId()"
    class="relative flex dropzone-spacer flex-1 flex-col"
    cdkDropList
    [cdkDropListConnectedTo]="formBuilderStore.dropListIds()"
    [cdkDropListData]="formFields()"
    (cdkDropListDropped)="drop($event)"
    [ngClass]="{ 'justify-center items-center flex-row min-h-32 h-full': formFields().length === 0 }"
  >
    @for (field of formFields(); track field) {
      <app-builder-workspace-form-field
        [field]="field"
        cdkDrag
        [cdkDragData]="field"
        class="form-field-drag-item my-3"
        (dropEmit)="drop($event)"
      />
    } @empty {
      <app-builder-workspace-empty-state class="block w-full h-full absolute top-0" />
    }
  </div>

  <!--
  <app-builder-workspace-field-selector
    (fieldSelected)="addNewField($event.type, $event.label)"
  ></app-builder-workspace-field-selector>-->
</div>
