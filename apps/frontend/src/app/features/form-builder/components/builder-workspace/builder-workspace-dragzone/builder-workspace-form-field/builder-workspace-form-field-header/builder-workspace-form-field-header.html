<header class="field-header flex min-h-8 items-center justify-between gap-3 select-none">
  <span
    class="flex items-center gap-2.5 text-xs font-semibold tracking-[0.04em] text-brand-text uppercase"
  >
    <span
      class="grid size-7.5 shrink-0 place-items-center rounded-lg border border-brand-bd bg-brand-soft"
      aria-hidden="true"
    >
      <ng-icon [name]="currentFieldIconLabel().icon" size="1rem" />
    </span>
    {{ currentFieldIconLabel().label | translate }}
  </span>

  <div
    class="flex items-center gap-0.5 text-text-2 transition-opacity duration-150 group-focus-within:opacity-100"
    [class.opacity-0]="!isFieldHighlighted()"
    role="toolbar"
    [attr.aria-label]="'formBuilder.workspace.fieldActions.label' | translate"
  >
    <app-button
      class="cursor-grab touch-none"
      icon="lucideGripVertical"
      variant="text"
      severity="secondary"
      size="small"
      [iconOnly]="true"
      [preventEventBubbling]="true"
      [ariaLabel]="'formBuilder.workspace.fieldActions.drag' | translate"
      cdkDragHandle
    />

    <div class="actions-inline">
      @for (item of menuActionItems(); track item.label) {
        <app-button
          [icon]="item.icon"
          variant="text"
          size="small"
          [severity]="item.severity"
          [iconOnly]="true"
          [preventEventBubbling]="true"
          [ariaLabel]="item.label | translate"
          (pressed)="item.command()"
        />
      }
    </div>

    <div class="actions-menu">
      <p-menu [model]="menuActionItems()" [popup]="true" appendTo="body" #fieldHeaderMenu>
        <ng-template #item let-item>
          <span
            class="flex cursor-pointer items-center gap-2 px-2 py-1.5"
            [class]="item.customClass"
          >
            <ng-icon [name]="item.icon" size="1rem" aria-hidden="true" />
            <span class="text-sm">{{ item.label | translate }}</span>
          </span>
        </ng-template>
      </p-menu>
      <app-button
        icon="lucideEllipsis"
        variant="text"
        size="small"
        severity="secondary"
        [iconOnly]="true"
        [preventEventBubbling]="true"
        [ariaLabel]="'formBuilder.workspace.fieldActions.more' | translate"
        (pressed)="$event.stopPropagation(); fieldHeaderMenu.toggle($event)"
      />
    </div>
  </div>
</header>
