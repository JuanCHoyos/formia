@if (builderPreviewState.isPreviewMode()) {
  <app-builder-workspace-preview class="block h-full min-h-0 w-full overflow-hidden" />
} @else {
  <section
    [attr.aria-label]="'formBuilder.workspace.ariaLabel' | translate"
    class="flex h-full min-h-0 w-full min-w-0 flex-col overflow-hidden bg-bg"
  >
    <app-builder-workspace-header class="block shrink-0" />
    <app-builder-workspace-dragzone
      cdkScrollable
      class="relative block min-h-0 w-full min-w-0 flex-1 overflow-x-hidden overflow-y-auto overscroll-contain"
    />

    @if (formBuilderStore.selectedViewOption() !== 'form-scroll') {
      <app-builder-workspace-footer class="block shrink-0" />
    }
  </section>
}
