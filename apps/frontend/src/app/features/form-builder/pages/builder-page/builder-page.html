@if (form.isLoading()) {
  <div role="status" [attr.aria-busy]="true" class="flex h-dvh w-full flex-col overflow-hidden">
    <span class="sr-only">{{ 'formBuilder.page.loading' | translate }}</span>
    <div class="flex h-16 shrink-0 items-center justify-between border-b border-[#d7dce5] px-4" aria-hidden="true">
      <div class="flex items-center gap-4">
        <p-skeleton width="8rem" height="2rem" borderRadius="0.5rem" />
        <p-skeleton width="16rem" height="2rem" borderRadius="0.5rem" />
      </div>
      <div class="flex items-center gap-2">
        <p-skeleton width="6rem" height="2.25rem" borderRadius="0.5rem" />
        <p-skeleton width="6rem" height="2.25rem" borderRadius="0.5rem" />
      </div>
    </div>
    <div class="flex min-h-0 flex-1" aria-hidden="true">
      <div class="flex w-80 shrink-0 flex-col gap-3 border-r border-[#d7dce5] p-4">
        <p-skeleton height="2.25rem" borderRadius="0.5rem" />
        <p-skeleton height="5rem" borderRadius="0.5rem" />
        <p-skeleton height="5rem" borderRadius="0.5rem" />
        <p-skeleton height="5rem" borderRadius="0.5rem" />
      </div>
      <div class="flex min-w-0 flex-1 flex-col gap-4 p-6">
        <p-skeleton height="3rem" borderRadius="0.5rem" />
        <p-skeleton height="6rem" borderRadius="0.5rem" />
        <p-skeleton height="6rem" borderRadius="0.5rem" />
        <p-skeleton height="6rem" borderRadius="0.5rem" />
      </div>
      <div class="flex w-96 shrink-0 flex-col gap-3 border-l border-[#d7dce5] p-4">
        <p-skeleton width="50%" height="1.5rem" />
        <p-skeleton height="2.5rem" borderRadius="0.5rem" />
        <p-skeleton height="2.5rem" borderRadius="0.5rem" />
      </div>
    </div>
  </div>
} @else if (form.error()) {
  <div role="alert" class="flex flex-col items-start gap-3 p-6">
    <h2 class="font-medium">{{ 'formBuilder.page.error' | translate }}</h2>
    <app-button variant="outlined" (pressed)="form.reload()">
      {{ 'formBuilder.page.retry' | translate }}
    </app-button>
  </div>
} @else {
<section
  [attr.aria-label]="'formBuilder.header.ariaLabel' | translate"
  class="flex h-dvh min-h-0 w-full flex-col overflow-hidden"
>
  <div class="h-16 w-full shrink-0 px-4 border-b border-[#d7dce5]">
    <app-builder-header />
  </div>



  <div class="flex min-h-0 flex-1 overflow-hidden">
    @if (!previewState.isPreviewMode()) {
      <div
        class="h-full min-h-0 shrink-0 transition-all duration-300 ease-in-out overflow-hidden"
        [class]="
          menuState.isLeftMenuOpen()
            ? 'w-80 border-r border-[#d7dce5] opacity-100'
            : 'w-0 border-r-0 border-transparent opacity-0'
        "
      >
        <div class="h-full min-h-0 w-80 overflow-hidden">
          <app-builder-sidebar class="block h-full min-h-0" />
        </div>
      </div>
    }

    <div class="flex h-full min-h-0 min-w-0 flex-1 overflow-hidden">
      <app-builder-workspace class="flex h-full min-h-0 min-w-0 flex-1 overflow-hidden" />
    </div>

    @if (!previewState.isPreviewMode()) {
      <div
        class="h-full min-h-0 shrink-0 transition-all duration-300 ease-in-out overflow-hidden"
        [class]="
          menuState.isRightMenuOpen()
            ? 'w-96 border-l border-[#d7dce5] opacity-100'
            : 'w-0 border-l-0 border-transparent opacity-0'
        "
      >
        <div class="h-full min-h-0 w-96 overflow-hidden">
          <app-builder-properties-sidebar class="block h-full min-h-0" />
        </div>
      </div>
    }
  </div>

</section>
}
