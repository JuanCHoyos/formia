<div class="social-login-buttons flex items-center gap-4">
  <app-button
    class="w-full"
    customClass="h-12 w-full text-lg"
    variant="outlined"
    severity="secondary"
    [iconOnly]="true"
    icon="svglGoogle"
    [ariaLabel]="'auth.socialLogin.google' | translate"
    [loading]="loadingProvider() === 'Google'"
    [disabled]="loadingProvider() !== null"
    (pressed)="signInWithProvider('Google')"
  ></app-button>
  <app-button
    class="w-full"
    customClass="h-12 w-full text-lg"
    variant="outlined"
    severity="secondary"
    [iconOnly]="true"
    icon="svglMicrosoft"
    [ariaLabel]="'auth.socialLogin.microsoft' | translate"
    [loading]="loadingProvider() === 'Microsoft'"
    [disabled]="loadingProvider() !== null"
    (pressed)="signInWithProvider('Microsoft')"
  ></app-button>
  <app-button
    class="w-full"
    customClass="h-12 w-full text-lg"
    variant="outlined"
    severity="secondary"
    [iconOnly]="true"
    icon="svglGithubLight"
    [ariaLabel]="'auth.socialLogin.github' | translate"
    [loading]="loadingProvider() === 'GitHub'"
    [disabled]="loadingProvider() !== null"
    (pressed)="signInWithProvider('GitHub')"
  ></app-button>
</div>
@if (loadingProvider(); as provider) {
  <p class="mt-3 text-sm text-text-2" role="status" aria-live="polite">
    {{ 'auth.socialLogin.redirecting' | translate: { provider: provider } }}
  </p>
}
