<header class="flex flex-col gap-5">
  @if (icon(); as icon) {
    <span
      class="grid size-11 place-items-center rounded-lg bg-brand-soft text-brand-text"
      aria-hidden="true"
    >
      <ng-icon [name]="icon" size="1.375rem" />
    </span>
  }
  <div class="flex flex-col gap-2.5">
    <p class="text-eyebrow">{{ eyebrow() }}</p>
    <h1
      class="text-[1.75rem] leading-[2.125rem] font-semibold tracking-[-0.035em] sm:text-title-xl"
    >
      {{ title() }}
    </h1>
    <p class="text-sm leading-6 text-text-2">
      {{ description() }}
      <ng-content />
    </p>
  </div>
</header>
