<div class="mb-8 flex flex-col gap-2">
  <div
    class="mb-5 inline-flex size-11 items-center justify-center rounded-lg bg-primary/10 text-primary"
  >
    <ng-icon [name]="icon()"></ng-icon>
  </div>
  <h3 class="mb-2 text-xs font-semibold uppercase tracking-[0.2em] text-primary">
    {{ eyebrow() }}
  </h3>
  <h2 class="text-3xl font-semibold tracking-[-0.04em] sm:text-4xl">{{ title() }}</h2>
  <p class="text-sm leading-6 text-muted-color">{{ description() }}</p>
</div>
