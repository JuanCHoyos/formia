<div class="flex flex-col gap-7">
  <div class="flex flex-col gap-5">
    <app-auth-steps [current]="3" [total]="3" labelKey="auth.steps.completeProfile" />
    <app-auth-header
      [eyebrow]="'auth.completeRegister.eyebrow' | translate"
      [title]="'auth.completeRegister.title' | translate"
      [description]="'auth.completeRegister.description' | translate"
    />
  </div>

  <form class="flex flex-col gap-6" novalidate (submit)="submit($event)">
    <div class="flex flex-col gap-2">
      <app-option-card-selector
        [options]="roleOptions()"
        [ariaLabel]="'roles.label' | translate"
        [formField]="registrationForm.roles"
      />
      <app-field-error id="roles-error" [state]="registrationForm.roles()" />
    </div>

    <div class="flex flex-col gap-1.5">
      <div class="flex items-start gap-2.5">
        <p-checkbox inputId="terms" [formField]="registrationForm.terms" [binary]="true" />
        <label for="terms" class="text-sm leading-5 text-text-2">
          {{ 'auth.register.acceptTerms' | translate }}
        </label>
      </div>
      <app-field-error id="terms-error" [state]="registrationForm.terms()" />
    </div>

    <app-button
      type="submit"
      class="w-full"
      customClass="h-12 w-full justify-center"
      [disabled]="registrationForm().invalid()"
      [loading]="isSubmitting()"
    >
      <span aria-live="polite">
        {{
          (isSubmitting() ? 'auth.completeRegister.submitting' : 'auth.completeRegister.submit')
            | translate
        }}
      </span>
    </app-button>
  </form>

  <p class="text-center text-xs text-text-3">{{ 'auth.completeRegister.laterHint' | translate }}</p>
</div>
