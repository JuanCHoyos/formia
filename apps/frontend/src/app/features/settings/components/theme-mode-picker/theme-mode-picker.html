<ng-template #preview let-scheme>
  <span
    class="mode-preview flex h-full w-full gap-1.5 bg-(--preview-bg) p-2"
    [attr.data-scheme]="scheme"
    aria-hidden="true"
  >
    <span
      class="flex w-1/4 flex-col gap-1 rounded-sm border border-(--preview-border) bg-(--preview-surface) p-1"
    >
      <span class="h-1.5 w-3/4 rounded-full bg-primary-500"></span>
      <span class="h-1 w-full rounded-full bg-(--preview-line)"></span>
      <span class="h-1 w-2/3 rounded-full bg-(--preview-line)"></span>
    </span>
    <span
      class="flex flex-1 flex-col gap-1.5 rounded-sm border border-(--preview-border) bg-(--preview-surface) p-1.5"
    >
      <span class="h-1.5 w-1/2 rounded-full bg-(--preview-line)"></span>
      <span class="h-1 w-5/6 rounded-full bg-(--preview-line) opacity-70"></span>
      <span class="h-1 w-2/3 rounded-full bg-(--preview-line) opacity-70"></span>
      <span class="mt-auto h-2.5 w-8 self-end rounded-[3px] bg-primary-500"></span>
    </span>
  </span>
</ng-template>

<div
  role="radiogroup"
  class="grid grid-cols-1 gap-3 min-[420px]:grid-cols-3"
  [attr.aria-label]="'appearance.mode.label' | translate"
>
  @for (option of options; track option.value) {
    <label
      #item
      class="group relative flex cursor-pointer flex-col overflow-hidden rounded-panel border border-border bg-surface transition-[border-color,box-shadow] duration-150 hover:border-border-hover has-checked:border-brand has-checked:shadow-[0_0_0_1px_var(--p-primary-color)] has-focus-visible:focus-ring"
    >
      <input
        type="radio"
        name="theme-mode"
        class="sr-only"
        [checked]="option.value === value()"
        (change)="selectionChange.emit({ value: option.value, element: item })"
      />
      <span class="relative aspect-video w-full border-b border-border">
        @if (option.value === 'system') {
          <span class="absolute inset-0 [clip-path:polygon(0_0,100%_0,0_100%)]">
            <ng-container *ngTemplateOutlet="preview; context: { $implicit: 'light' }" />
          </span>
          <span class="absolute inset-0 [clip-path:polygon(100%_0,100%_100%,0_100%)]">
            <ng-container *ngTemplateOutlet="preview; context: { $implicit: 'dark' }" />
          </span>
        } @else {
          <ng-container *ngTemplateOutlet="preview; context: { $implicit: option.value }" />
        }
      </span>
      <span class="flex items-center gap-2 px-3 py-2.5">
        <span
          class="flex size-4 shrink-0 items-center justify-center rounded-full border border-border-strong bg-surface transition-[border-width,border-color] group-has-checked:border-[5px] group-has-checked:border-brand"
          aria-hidden="true"
        ></span>
        <span class="flex-1 text-sm font-medium">{{ option.labelKey | translate }}</span>
        @if (option.icon) {
          <ng-icon [name]="option.icon" size="1rem" class="text-text-3" aria-hidden="true" />
        }
      </span>
    </label>
  }
</div>
