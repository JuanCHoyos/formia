<main class="mx-auto w-full max-w-5xl px-4 py-6 sm:px-6 lg:px-10 lg:py-10">
  <header>
    <h1 class="text-h1 sm:text-display">{{ 'settings.title' | translate }}</h1>
    <p class="mt-1 text-sm text-text-2">{{ 'settings.description' | translate }}</p>
  </header>

  <div class="mt-6 flex flex-col gap-6 lg:mt-8 lg:flex-row lg:gap-10">
    <nav
      class="-mx-4 overflow-x-auto px-4 sm:mx-0 sm:px-0 lg:w-52 lg:shrink-0"
      [attr.aria-label]="'settings.nav.label' | translate"
    >
      <ul class="flex gap-1 border-b border-border lg:flex-col lg:gap-0.5 lg:border-b-0">
        @for (item of navItems; track item.route) {
          <li>
            <a
              [routerLink]="item.route"
              routerLinkActive="settings-nav-active"
              ariaCurrentWhenActive="page"
              class="-mb-px flex items-center gap-2 whitespace-nowrap border-b-2 border-transparent px-3 py-2.5 text-sm font-medium text-text-2 transition-colors hover:text-text focus-visible:focus-ring lg:mb-0 lg:rounded-control lg:border-b-0 lg:py-2 lg:hover:bg-hover [&.settings-nav-active]:border-brand [&.settings-nav-active]:text-brand-text lg:[&.settings-nav-active]:bg-brand-soft"
            >
              <ng-icon [name]="item.icon" size="1rem" aria-hidden="true" />
              {{ item.labelKey | translate }}
            </a>
          </li>
        }
      </ul>
    </nav>

    <div class="min-w-0 flex-1">
      <router-outlet />
    </div>
  </div>
</main>
