<button
  pSidebarMenuButton
  type="button"
  class="h-auto! p-1!"
  aria-haspopup="dialog"
  [attr.aria-expanded]="isOpen()"
  (click)="popover.toggle($event)"
>
  <p-avatar
    [label]="userStore.initials()"
    shape="circle"
    class="size-7 shrink-0 bg-brand-soft text-xs font-semibold text-brand-text"
  />
  <span class="flex min-w-0 flex-1 flex-col text-left leading-tight">
    <span class="truncate text-sm font-semibold text-text">{{ name() }}</span>
    <span class="truncate text-xs font-normal text-text-3">{{ email() }}</span>
  </span>
  <ng-icon name="lucideChevronsUpDown" class="shrink-0 text-text-3" aria-hidden="true" />
</button>

<p-popover
  #popover
  appendTo="body"
  [ariaLabel]="'userMenu.label' | translate"
  (onShow)="isOpen.set(true)"
  (onHide)="isOpen.set(false)"
>
  <div class="flex w-[min(17rem,calc(100vw-2rem))] flex-col">
    <div class="flex items-center gap-3 px-1 pb-3">
      <p-avatar
        [label]="userStore.initials()"
        shape="circle"
        size="large"
        class="shrink-0 bg-brand-soft text-sm font-semibold text-brand-text"
      />
      <div class="min-w-0">
        <p class="truncate text-sm font-semibold">{{ name() }}</p>
        <p class="truncate text-xs text-text-3">{{ email() }}</p>
      </div>
    </div>

    <div class="border-t border-border py-3">
      <p class="mb-2 px-1 text-overline" id="user-menu-theme">
        {{ 'appearance.mode.label' | translate }}
      </p>
      <app-segmented-control
        ariaLabelledBy="user-menu-theme"
        [options]="themeModes"
        [value]="theme.mode()"
        (selectionChange)="setMode($event)"
      />
    </div>

    <nav
      class="flex flex-col gap-0.5 border-t border-border py-2"
      [attr.aria-label]="'userMenu.account' | translate"
    >
      @for (link of links; track link.route) {
        <a
          [routerLink]="link.route"
          class="flex items-center gap-2.5 rounded-control px-2 py-2 text-sm text-text-2 transition-colors hover:bg-hover hover:text-text focus-visible:focus-ring"
          (click)="followLink(popover)"
        >
          <ng-icon [name]="link.icon" size="1rem" class="text-text-3" aria-hidden="true" />
          {{ link.labelKey | translate }}
        </a>
      }
    </nav>

    <div class="border-t border-border pt-2">
      <button
        type="button"
        class="flex w-full items-center gap-2.5 rounded-control px-2 py-2 text-sm text-danger-text transition-colors hover:bg-danger-bg focus-visible:focus-ring disabled:opacity-60"
        [disabled]="isSigningOut()"
        (click)="confirmSignOut(popover)"
      >
        <ng-icon name="lucideLogOut" size="1rem" aria-hidden="true" />
        {{ 'userMenu.signOut' | translate }}
      </button>
    </div>
  </div>
</p-popover>
