<p-sidebar-layout class="min-h-screen">
  @if (isMobile() && open()) {
    <p-sidebar-backdrop />
  }
  <p-sidebar id="main-sidebar" [collapsible]="isMobile() ? 'offcanvas' : 'icon'" [overlay]="isMobile()" [(open)]="open">
    <p-sidebar-spacer />
    <p-sidebar-aside>
      <p-sidebar-panel>
        <p-sidebar-header>
          <p-sidebar-menu>
            <p-sidebar-menu-item>
              <a pSidebarMenuButton routerLink="/dashboard/forms" class="p-1!">
                <span class="flex size-6 shrink-0 items-center justify-center rounded-md bg-primary text-xs font-bold leading-none text-white">F</span>
                <span class="text-sm font-semibold">Formia</span>
              </a>
            </p-sidebar-menu-item>
          </p-sidebar-menu>
        </p-sidebar-header>

        <p-sidebar-content>
          <p-sidebar-group>
            <p-sidebar-group-content>
              <p-sidebar-menu>
                <p-sidebar-menu-item>
                  <a
                    pSidebarMenuButton
                    routerLink="/dashboard/forms"
                    routerLinkActive
                    #dashboardLink="routerLinkActive"
                    [isActive]="dashboardLink.isActive"
                  >
                    <svg data-p-icon="home" aria-hidden="true"></svg>
                    <span>{{ 'dashboard.nav.forms' | translate }}</span>
                  </a>
                </p-sidebar-menu-item>
              </p-sidebar-menu>
            </p-sidebar-group-content>
          </p-sidebar-group>
        </p-sidebar-content>

        <p-sidebar-footer>
          <p-sidebar-menu>
            <p-sidebar-menu-item>
              <button pSidebarMenuButton type="button" class="p-1!">
                <p-avatar [label]="userStore.initials()" shape="circle" class="size-6 shrink-0 text-xs" />
                <span class="truncate">{{ userStore.user()?.fullName }}</span>
              </button>
            </p-sidebar-menu-item>
          </p-sidebar-menu>
        </p-sidebar-footer>
        <button pSidebarRail type="button" [attr.aria-label]="'dashboard.nav.toggleSidebar' | translate"></button>
      </p-sidebar-panel>
    </p-sidebar-aside>
  </p-sidebar>

  <p-sidebar-main>
    <header class="flex h-12 items-center gap-2 border-b border-surface-200 px-4">
      <button
        pButton
        pSidebarTrigger
        type="button"
        target="main-sidebar"
        severity="secondary"
        text
        size="small"
        [attr.aria-label]="'dashboard.nav.toggleSidebar' | translate"
      >
        <svg data-p-icon="sidebar" aria-hidden="true"></svg>
      </button>
    </header>
    <router-outlet />
  </p-sidebar-main>
</p-sidebar-layout>
