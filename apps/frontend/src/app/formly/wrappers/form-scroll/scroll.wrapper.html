<div class="grid grid-cols-1 gap-6">
  @for (field of field.fieldGroup; track $index) {
    <p-divider align="left" type="solid">
      <span class="text-overline">{{ field.props?.label }}</span>
    </p-divider>
    <formly-field [field]="field" />
  }
</div>

<div class="mt-6 flex justify-end">
  <app-button
    type="submit"
    [disabled]="field.formControl?.invalid ?? true"
    icon="lucideArrowRight"
    iconPosition="right"
  >
    {{ 'common.actions.submit' | translate }}
  </app-button>
</div>
