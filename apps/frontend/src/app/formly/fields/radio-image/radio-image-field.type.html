<app-preview-card-selector
  [options]="props.options"
  [value]="formControl.value"
  [disabled]="formControl.disabled"
  [ariaLabel]="props.label"
  (valueChange)="formControl.setValue($event)"
  (touch)="formControl.markAsTouched()"
>
  <ng-template [appPreviewCard]="props.options" let-option>
    <img [src]="option.image" [alt]="option.label" class="size-full object-cover" />
  </ng-template>
</app-preview-card-selector>
