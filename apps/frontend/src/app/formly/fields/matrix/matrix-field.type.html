<p-table [value]="props.questions" showGridlines [tableStyle]="{ width: '100%' }">
  <ng-template #header>
    <tr>
      <th scope="col">{{ 'formBuilder.matrix.question' | translate }}</th>

      @for (answer of props.answers; track answer.value) {
        <th scope="col" class="text-center">
          {{ answer.label }}
        </th>
      }
    </tr>
  </ng-template>

  <ng-template #body let-question>
    <tr>
      <td>
        {{ question.label }}
      </td>

      @for (answer of props.answers; track answer.value) {
        <td class="text-center">
          @if (props.selectionMode === 'single') {
            <p-radiobutton
              [name]="question.value"
              [value]="answer.value"
              [formControl]="radioControlFor(question.value)"
            />
          } @else {
            <p-checkbox
              [binary]="true"
              [inputId]="question.value + '-' + answer.value"
              [value]="answer.value"
              [formControl]="checkboxControlFor(question.value, answer.value)"
            />
          }
        </td>
      }
    </tr>
  </ng-template>
</p-table>
