<div class="max-w-fit flex flex-col gap-2">
  @switch (props.type) {
    @case ('star') {
      <p-rating [formControl]="formControl" [allowHalf]="props.allowHalf" [stars]="props.stars" />
    }

    @case ('number') {
      <app-rating-scale
        [count]="props.stars"
        [value]="formControl.value"
        [disabled]="formControl.disabled"
        [ariaLabel]="props.label"
        (valueChange)="formControl.setValue($event)"
        (touch)="formControl.markAsTouched()"
      />
    }
  }

  <div class="flex items-center justify-between">
    <small class="text-xs text-text-3">
      {{ props.lowLabel || ('formBuilder.rating.low' | translate) }}
    </small>
    <small class="text-xs text-text-3">
      {{ props.highLabel || ('formBuilder.rating.high' | translate) }}
    </small>
  </div>
</div>
